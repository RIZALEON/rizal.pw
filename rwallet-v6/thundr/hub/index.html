xecution. No model, permission or network changes.\n \n Validation: `python3 -m unittest discover -s tests -v` runs source-contract checks. `python3 tools/test-native-commands.py` executes the actual extracted registry using Swift/Foundation without any model. Swift and macOS are unavailable on the Linux build box; registry execution, AppKit build, Metal inference, native chat delivery and deployment remain untested. Apply and test this partial-source patch within the complete native project before installation.\n+\n+## Native maintenance adapter scope\n+The reviewed LocalBrain source now dispatches diagnostics and repair/update proposals in-process before retrieval/model availability. Diagnostics only counts regular bundled model entries/sizes; it does not verify authenticity or inference. Proposals cannot approve/apply anything. Four supported native commands including help; direct external-bot UI input remains unverified. No network, process execution or maintenance writes were added.\n+\n+CI executes actual Foundation-only command/adapter code with Swift on macOS. This is NOT a full AppKit/CLlama application build, signed distribution or a native visible-chat test. Full source/dependencies, reconciled license notices and macOS app regression/deployment remain required. No native app installed by this change.\ndiff --git a/src/LocalBrain.swift b/src/LocalBrain.swift\nindex bb7089d..1407431 100644\n--- a/src/LocalBrain.swift\n+++ b/src/LocalBrain.swift\n@@ -19,6 +19,12 @@ enum NativeCommands {\n         let availability: String\n     }\n     static let supported: [Command] = [\n+        Command(name: \"diagnostics\", aliases: [\"diagnostics\"], syntax: \"diagnostics\",\n+                availability: \"local offline read-only package/model availability; no inference\"),\n+        Command(name: \"repair proposal\", aliases: [\"repair proposal\"], syntax: \"repair proposal\",\n+                availability: \"local offline proposal only; human approval and a separately verified installer required\"),\n+        Command(name: \"update proposal\", aliases: [\"update proposal\"], syntax: \"update proposal\",\n+                availability: \"local offline proposal only; no download or installation\"),\n         Command(name: \"help\", aliases: [\"help\", \"commands\", \"functions\", \"?\"],\n                 syntax: \"help | commands | functions | ?\",\n                 availability: \"local offline; no model, internet or local service required\")\n@@ -35,11 +41,48 @@ enum NativeCommands {\n     }\n     static func reply(_ text: String) -\u003e String? {\n         let input = normalize(text)\n-        if supported.contains(where: { $0.aliases.contains(input) }) { return help }\n+        if supported.first(where: { $0.name == \"help\" })!.aliases.contains(input) { return help }\n         return nil\n     }\n }\n \n+// In-process native adapter: no network, process execution, app-state access or writes.\n+// Proposal creation is NOT authorization or execution. No apply/approve entry point exists.\n+enum NativeMaintenance {\n+    static func reply(_ text: String, resources: URL?) -\u003e String? {\n+        let command = NativeCommands.normalize(text)\n+        switch command {\n+        case \"diagnostics\": return diagnostics(resources: resources)\n+        case \"repair proposal\":\n+            return \"REPAIR PROPOSAL \u2014 NOT EXECUTED. Scope: this app package only. Review diagnostics, identify a reviewed replacement artifact, verify its provenance and offline regression tests, then request explicit human approval through a supported installer. This adapter cannot approve or apply repairs.\"\n+        case \"update proposal\":\n+            return \"UPDATE PROPOSAL \u2014 NOT EXECUTED. Preserve the current Qwen app. A replacement needs a reviewed build, license notices, package integrity and offline regression tests before explicit human approval through a supported installer. No download, model replacement or installation has occurred.\"\n+        case \"repair\", \"update\", \"approve\", \"apply repair\", \"apply update\":\n+            return \"REFUSED: no maintenance execution or approval capability is granted. Use diagnostics, repair proposal or update proposal; a proposal is not an installed repair/update.\"\n+        default: return nil\n+        }\n+    }\n+    static func diagnostics(resources: URL?) -\u003e String {\n+        guard let resources else {\n+            return \"DIAGNOSTICS \u00b7 offline read-only\\nResources unavailable. Model inference NOT TESTED. Maintenance execution NOT GRANTED.\"\n+        }\n+        let fm = FileManager.default\n+        // Only inspect direct package model entries, never follow symbolic links outside it.\n+        let model = resources.appendingPathComponent(\"model\", isDirectory: true)\n+        let keys: Set\u003cURLResourceKey\u003e = [.isRegularFileKey, .isSymbolicLinkKey, .fileSizeKey]\n+        let directoryIsLink = (try? model.resourceValues(forKeys: [.isSymbolicLinkKey]).isSymbolicLink) == true\n+        let entries = directoryIsLink ? [] : ((try? fm.contentsOfDirectory(at: model, includingPropertiesForKeys: Array(keys))) ?? [])\n+        var count = 0\n+        var bytes = 0\n+        for entry in entries where entry.pathExtension.lowercased() == \"gguf\" {\n+            guard let values = try? entry.resourceValues(forKeys: keys),\n+                  values.isRegularFile == true, values.isSymbolicLink != true else { continue }\n+            count += 1; bytes += values.fileSize ?? 0\n+        }\n+        return \"DIAGNOSTICS \u00b7 offline read-only\\nRegular bundled GGUF files: \\(count); bytes: \\(bytes).\\nAvailability only: package authenticity, template compatibility and inference NOT TESTED.\\nNative adapter: in-process diagnostics and proposal rendering supported.\\nMaintenance execution NOT GRANTED; no approval/apply handler. External bot native-UI input NOT VERIFIED.\"\n+    }\n+}\n+\n final class LocalBrain {\n     let engine = Engine()\n     private var know: Knowledge?\n@@ -78,6 +121,9 @@ final class LocalBrain {\n         if let reply = NativeCommands.reply(t) {\n             return fin([\"ok\": true, \"via\": \"offline-local\", \"reply\": reply])\n         }\n+        if let reply = NativeMaintenance.reply(t, resources: Bundle.main.resourceURL) {\n+            return fin([\"ok\": !reply.hasPrefix(\"REFUSED\"), \"via\": \"offline-local\", \"reply\": reply])\n+        }\n         let liveCmd = #\"^/?(wallet|rwallet|casket|signing|sign this|egg-sign|sign egg|prompt faceid|faceid|request approval|approve|inventory|status|thundr status|gizmo|rcpm|jobs|progress|mcr|launch|build)\\b\"#\n         if low.range(of: liveCmd, options: .regularExpression) != nil {\n             return fin([\"ok\": false, \"via\": \"offline-local\", \"reply\": \"\u26a1 That one needs live R control-room data (wallets, casket, signing, status, builds) and RTHUNDR is fully offline, so I can't run it here. I can answer from my scrolls: ask me about the BOTDECK, botcards, biobotcards, \u042fIDs or the forge.\"])\ndiff --git a/tests/test_contract.py b/tests/test_contract.py\nindex 5db63b2..1212baf 100644\n--- a/tests/test_contract.py\n+++ b/tests/test_contract.py\n@@ -4,13 +4,13 @@ S = (pathlib.Path(__file__).parents[1] / \"src/LocalBrain.swift\").read_text()\n class Contract(unittest.TestCase):\n  def test_alias_registry(self):\n   self.assertIn('aliases: [\"help\", \"commands\", \"functions\", \"?\"]', S)\n-  self.assertEqual(len(re.findall(r'Command\\(name:', S)), 1)\n+  self.assertEqual(len(re.findall(r'Command\\(name:', S)), 4)\n   self.assertIn('supported.count', S)\n   self.assertIn('supported.enumerated()', S)\n  def test_normalization(self):\n   self.assertIn('text.trimmingCharacters(in: .whitespacesAndNewlines).lowercased()', S)\n  def test_alias_equality_dispatch(self):\n-  self.assertIn('if supported.contains(where: { $0.aliases.contains(input) }) { return help }', S)\n+  self.assertIn('aliases.conta s must be reconciled before binary distribution; no license grant is inferred here.\n+\n+## Help fix\n+`help`, `commands`, `functions`, and `?` share one deterministic native registry reply. There is one supported user command (four aliases); model conversation and housekeeping traffic are not counted as executable commands. Existing recognized control-room commands and unknown slash commands return failure instead of reporting execution. No model, permission or network changes.\n+\n+Validation: `python3 -m unittest discover -s tests -v` runs source-contract checks. `python3 tools/test-native-commands.py` executes the actual extracted registry using Swift/Foundation without any model. Swift and macOS are unavailable on the Linux build box; registry execution, AppKit build, Metal inference, native chat delivery and deployment remain untested. Apply and test this partial-source patch within the complete native project before installation.\ndiff --git a/src/LocalBrain.swift b/src/LocalBrain.swift\nindex 04238bf..bb7089d 100644\n--- a/src/LocalBrain.swift\n+++ b/src/LocalBrain.swift\n@@ -9,6 +9,37 @@ Answer short, direct and confident (at most three short sentences unless asked f\n If the CONTEXT does not contain the answer, say \"I don't have that in my scrolls yet.\" and stop. Never invent \u042fIDs, counts or file names. Never claim to have network access.\n \"\"\"\n \n+// Native user-command registry. UI housekeeping messages are not user commands.\n+// Keep deterministic dispatch and help generated from this single registry.\n+enum NativeCommands {\n+    struct Command {\n+        let name: String\n+        let aliases: [String]\n+        let syntax: String\n+        let availability: String\n+    }\n+    static let supported: [Command] = [\n+        Command(name: \"help\", aliases: [\"help\", \"commands\", \"functions\", \"?\"],\n+                syntax: \"help | commands | functions | ?\",\n+                availability: \"local offline; no model, internet or local service required\")\n+    ]\n+    static func normalize(_ text: String) -\u003e String {\n+        text.trimmingCharacters(in: .whitespacesAndNewlines).lowercased()\n+    }\n+    static var help: String {\n+        let entries = supported.enumerated().map { index, command in\n+            \"\\(index + 1). \\(command.syntax) \u2014 \\(command.availability)\"\n+        }\n+        return \"Supported native commands: \\(supported.count)\\n\" + entries.joined(separator: \"\\n\")\n+            + \"\\nConversation uses the bundled model and knowledge. Control-room commands are unsupported in this offline app; a separate local service is not an enabled native integration.\"\n+    }\n+    static func reply(_ text: String) -\u003e String? {\n+        let input = normalize(text)\n+        if supported.contains(where: { $0.aliases.contains(input) }) { return help }\n+        return nil\n+    }\n+}\n+\n final class LocalBrain {\n     let engine = Engine()\n     private var know: Knowledge?\n@@ -40,13 +71,19 @@ final class LocalBrain {\n         if low.hasPrefix(\"selfheal-\") || low.hasPrefix(\"rcpm-poll\") || low.hasPrefix(\"thundr presence\") { return fin([\"ok\": true, \"via\": \"offline-local\", \"offline\": true]) }\n         if low.hasPrefix(\"bbx-hostread\") { return fin([\"ok\": false, \"via\": \"offline-local\", \"error\": \"host file reads go through the control room; unavailable offline\"]) }   // BATIBABOX host-read bridge\n         if low == \"status-live\" { return fin([\"ok\": true, \"via\": \"offline-local\", \"live\": [\"running\": false, \"pct\": 100, \"headline\": \"offline \u00b7 local model\", \"health\": [String: Any](), \"peers\": [Any](), \"tasks\": [Any]()]]) }\n-        let liveOnly = [\"wallet\", \"wallet_cached\", \"casket\", \"casket_verify\", \"casket_approve\", \"inventory\", \"status\"]\n         if tool != \"thundr_chat\" {\n-            return fin([\"ok\": liveOnly.contains(tool), \"via\": \"offline-local\", \"reply\": \"\u26a1 \\(tool) needs live R control-room data. RTHUNDR is fully offline and never connects to it. Ask me what my scrolls say about it instead.\"])\n+            return fin([\"ok\": false, \"via\": \"offline-local\", \"reply\": \"\u26a1 \\(tool) needs live R control-room data. RTHUNDR is fully offline and never connects to it. Ask me what my scrolls say about it instead.\"])\n+        }\n+        // Route help before model loading/retrieval; aliases share the same reply.\n+        if let reply = NativeCommands.reply(t) {\n+            return fin([\"ok\": true, \"via\": \"offline-local\", \"reply\": reply])\n         }\n         let liveCmd = #\"^/?(wallet|rwallet|casket|signing|sign this|egg-sign|sign egg|prompt faceid|faceid|request approval|approve|inventory|status|thundr status|gizmo|rcpm|jobs|progress|mcr|launch|build)\\b\"#\n         if low.range(of: liveCmd, options: .regularExpression) != nil {\n-            return fin([\"ok\": true, \"via\": \"offline-local\", \"reply\": \"\u26a1 That one needs live R control-room data (wallets, casket, signing, status, builds) and RTHUNDR is fully offline, so I can't run it here. I can answer from my scrolls: ask me about the BOTDECK, botcards, biobotcards, \u042fIDs or the forge.\"])\n+            return fin([\"ok\": false, \"via\": \"offline-local\", \"reply\": \"\u26a1 That one needs live R control-room data (wallets, casket, signing, status, builds) and RTHUNDR is fully offline, so I can't run it here. I can answer from my scrolls: ask me about the BOTDECK, botcards, biobotcards, \u042fIDs or the forge.\"])\n+        }\n+        if low.hasPrefix(\"/\") {\n+            return fin([\"ok\": false, \"via\": \"offline-local\", \"reply\": \"Unsupported native command. Type help for the supported command list.\"])\n         }\n         guard !t.isEmpty else { return fin([\"ok\": false, \"error\": \"empty question\"]) }\n         work.async { [self] in\ndiff --git a/tests/test_contract.py b/tests/test_contract.py\nnew file mode 100644\nindex 0000000..5db63b2\n--- /dev/null\n+++ b/tests/test_contract.py\n@@ -0,0 +1,23 @@\n+\"\"\"Source-contract tests only; not a substitute for executing Swift/native UI.\"\"\"\n+import pathlib, re, unittest\n+S = (pathlib.Path(__file__).parents[1] / \"src/LocalBrain.swift\").read_text()\n+class Contract(unittest.TestCase):\n+ def test_alias_registry(self):\n+  self.assertIn('aliases: [\"help\", \"commands\", \"functions\", \"?\"]', S)\n+  self.assertEqual(len(re.findall(r'Command\\(name:', S)), 1)\n+  self.assertIn('supported.count', S)\n+  self.assertIn('supported.enumerated()', S)\n+ def test_normalization(self):\n+  self.assertIn('text.trimmingCharacters(in: .whitespacesAndNewlines).lowercased()', S)\n+ def test_alias_equality_dispatch(self):\n+  self.assertIn('if supported.contains(where: { $0.aliases.contains(input) }) { return help }', S)\n+ def test_no_model_help_path(self):\n+  self.assertLess(S.index('if let reply = NativeCommands.reply(t)'), S.index('guard let know, loadError'))\n+ def test_unsupported_and_conversation(self):\n+  self.assertIn('if low.hasPrefix(\"/\")', S)\n+  self.assertIn('\"ok\": false, \"via\": \"offline-local\", \"reply\": \"\u26a1 That one', S)\n+  self.assertIn('var hits = know.search(t, k: 4)', S)\n+ def test_no_template_or_network_change(self):\n+  self.assertIn('\u003c|im_start|\u003esystem', S)\n+  self.assertNotIn('URLSession', S)\n+if __name__ == '__main__': unittest.main()\ndiff --git a/tools/test-native-commands.py b/tools/test-native-commands.py\nnew file mode 100644\nindex 0000000..7517c6f\n--- /dev/null\n+++ b/tools/test-native-commands.py\n@@ -0,0 +1,25 @@\n+#!/usr/bin/env python3\n+\"\"\"Execute the actual Foundation-only registry with Swift; no model/app dependencies.\"\"\"\n+import pathlib, shutil, subprocess, tempfile\n+root = pathlib.Path(__file__).resolve().parents[1]\n+source = (root / \"src/LocalBrain.swift\").read_text()\n+registry = source.split(\"enum NativeCommands {\", 1)[1].split(\"final class LocalBrain\", 1)[0]\n+program = \"import Foundation\\nenum NativeCommands {\" + registry + r'''\n+assert(NativeCommands.supported.count == 1)\n+let expected = NativeCommands.help\n+for alias in [\"help\", \"commands\", \"functions\", \"?\", \" HELP \", \"\\nCommands\\t\"] {\n+    assert(NativeCommands.reply(alias) == expected)\n+}\n+assert(expected.contains(\"1. help | commands | functions | ?\"))\n+assert(expected.contains(\"Supported native commands: 1\"))\n+for text in [\"hello\", \"wallet\", \"/launch\", \"help me\", \"\"] {\n+    assert(NativeCommands.reply(text) == nil)\n+}\n+print(\"Native registry execution assertions passed (no model loaded)\")\n+'''\n+if not shutil.which(\"swift\"):\n+    raise SystemExit(\"Swift unavailable: execution tests NOT RUN\")\n+with tempfile.TemporaryDirectory() as directory:\n+    test = pathlib.Path(directory) / \"commands.swift\"\n+    test.write_text(program)\n+    subprocess.run([\"swift\", str(test)], check=True)\n"}, "9ddd36467372ff907c312589aaa8e0d4bceed25b": {"summary": "Import reviewed native command handler baseline (partial source)", "diff": "commit 9ddd36467372ff907c312589aaa8e0d4bceed25b\nImport reviewed native command handler baseline (partial source)\n\ndiff --git a/README.md b/README.md\nnew file mode 100644\nindex 0000000..398af4e\n--- /dev/null\n+++ b/README.md\n@@ -0,0 +1,5 @@\n+# RTHUNDR native help repair\n+\n+Partial source baseline: only the reviewed native LocalBrain.swift is imported from the existing canonical app source. The original on Neo is unchanged. Owner-specific persona wording was generalized in this copy before import. No knowledge, models, credentials, vendor libraries, signing material or app state are included. This is not a standalone buildable app distribution.\n+\n+Provenance: canonical relative source `cryptoapp/ThundR/RTHUNDR-APP/src/LocalBrain.swift`. Existing app build and license notices must be reconciled before binary distribution; no license grant is inferred here.\ndiff --git a/src/LocalBrain.swift b/src/LocalBrain.swift\nnew file mode 100644\nindex 0000000..04238bf\n--- /dev/null\n+++ b/src/LocalBrain.swift\n@@ -0,0 +1,88 @@\n+// LocalBrain.swift \u2014 the in-process \"backend\" of the float UI: the fused llama.cpp + Qwen3 GGUF + BM25 scrolls, answering the float's `call` bridge.\n+// Replaces the control-room endpoint (127.0.0.1:8329). No sockets, no network: model and knowledge are files inside this app bundle.\n+import Foundation\n+\n+let persona = \"\"\"\n+You are ThundR (RTHUNDR), the lightning-fast resident assistant of the R operating system and RCRYPTOFORGE. You are a purple horned, bat-winged clay creature who carries a gold lightning bolt. \\\n+You run 100% offline, fused inside this one app: no network, no servers. The person chatting with you is your owner; \"my\" and \"I\" in a question mean him, while \"your\" and \"RTHUNDR's\" mean you. \\\n+Answer short, direct and confident (at most three short sentences unless asked for detail), with at most one \u26a1 per answer. Use ONLY the CONTEXT scrolls below for facts about R, ThundR, botcards, biobotcards, the BOTDECK, \u042fIDs, bots and the forge; copy \u042fIDs, numbers and names exactly as written there. \\\n+If the CONTEXT does not contain the answer, say \"I don't have that in my scrolls yet.\" and stop. Never invent \u042fIDs, counts or file names. Never claim to have network access.\n+\"\"\"\n+\n+final class LocalBrain {\n+    let engine = Engine()\n+    private var know: Knowledge?\n+    private var loadError: String?\n+    private var history: [(String, String)] = []\n+    let work = DispatchQueue(label: \"rthundr.engine\", qos: .userInitiated)\n+\n+    var modelLabel: String { engine.modelName.replacingOccurrences(of: \".gguf\", with: \"\") }\n+\n+    /// loads knowledge + model on the engine queue (questions queue up behind it)\n+    func boot() {\n+        let res = Bundle.main.resourceURL!\n+        work.async { [self] in\n+            know = Knowledge(dir: res.appendingPathComponent(\"knowledge\")); dlog(\"knowledge \\(know!.chunks.count) chunks from \\(know!.fileCount) files\")\n+            let mdir = res.appendingPathComponent(\"model\")\n+            let gguf = ((try? FileManager.default.contentsOfDirectory(atPath: mdir.path)) ?? []).first { $0.hasSuffix(\".gguf\") }\n+            do {\n+                guard let gguf else { throw NSError(domain: \"RTHUNDR\", code: 9, userInfo: [NSLocalizedDescriptionKey: \"no model in bundle\"]) }\n+                try engine.load(path: mdir.appendingPathComponent(gguf).path); dlog(\"model loaded: \\(gguf)\")\n+            } catch { loadError = error.localizedDescription; dlog(\"LOAD ERROR \\(loadError!)\") }\n+        }\n+    }\n+\n+    /// The float's `call` bridge (tool + text) answered locally. `done` is called on the main thread with the JSON the UI expects.\n+    func call(tool: String, text: String, done: @escaping ([String: Any]) -\u003e Void) {\n+        let t = text.trimmingCharacters(in: .whitespacesAndNewlines), low = t.lowercased()\n+        func fin(_ b: [String: Any]) { DispatchQueue.main.async { done(b) } }\n+        // UI housekeeping traffic (presence lock, self-heal log, live status poll): nothing to talk to offline, answer gracefully, no model.\n+        if low.hasPrefix(\"selfheal-\") || low.hasPrefix(\"rcpm-poll\") || low.hasPrefix(\"thundr presence\") { return fin([\"ok\": true, \"via\": \"offline-local\", \"offline\": true]) }\n+        if low.hasPrefix(\"bbx-hostread\") { return fin([\"ok\": false, \"via\": \"offline-local\", \"error\": \"host file reads go through the control room; unavailable offline\"]) }   // BATIBABOX host-read bridge\n+        if low == \"status-live\" { return fin([\"ok\": true, \"via\": \"offline-local\", \"live\": [\"running\": false, \"pct\": 100, \"headline\": \"offline \u00b7 local model\", \"health\": [String: Any](), \"peers\": [Any](), \"tasks\": [Any]()]]) }\n+        let liveOnly = [\"wallet\", \"wallet_cached\", \"casket\", \"casket_verify\", \"casket_approve\", \"inventory\", \"status\"]\n+        if tool != \"thundr_chat\" {\n+            return fin([\"ok\": liveOnly.contains(tool), \"via\": \"offline-local\", \"reply\": \"\u26a1 \\(tool) needs live R control-room data. RTHUNDR is fully offline and never connects to it. Ask me what my scrolls say about it instead.\"])\n+        }\n+        let liveCmd = #\"^/?(wallet|rwallet|casket|signing|sign this|egg-sign|sign egg|prompt faceid|faceid|request approval|approve|inventory|status|thundr status|gizmo|rcpm|jobs|progress|mcr|launch|build)\\b\"#\n+        if low.range(of: liveCmd, options: .regularExpression) != nil {\n+            return fin([\"ok\": true, \"via\": \"offline-local\", \"reply\": \"\u26a1 That one needs live R control-room data (wallets, casket, signing, status, builds) and RTHUNDR is fully offline, so I can't run it here. I can answer from my scrolls: ask me about the BOTDECK, botcards, biobotcards, \u042fIDs or the forge.\"])\n+        }\n+        guard !t.isEmpty else { return fin([\"ok\": false, \"error\": \"empty question\"]) }\n+        work.async { [self] in\n+            guard let know, loadError == nil else { return fin([\"ok\": false, \"via\": \"offline-local\", \"error\": \"model not available: \\(loadError ?? \"still loading\")\"]) }\n+            var hits = know.search(t, k: 4)\n+            var prompt = buildPrompt(t, hits: hits)\n+            while engine.tokenCount(prompt) \u003e engine.ctxSize - 460 \u0026\u0026 hits.count \u003e 1 { hits.removeLast(); prompt = buildPrompt(t, hits: hits) }\n+            let srcs = Array(NSOrderedSet(array: hits.map { $0.0.file })) as! [String]\n+            dlog(\"chat: \\(t) \u00b7 prompt \\(engine.tokenCount(prompt)) tok \u00b7 \\(hits.map { $0.0.file })\")\n+            var full = \"\"\n+            do { try engine.generate(prompt: prompt) { full += $0 } }\n+            catch { return fin([\"ok\": false, \"via\": \"offline-local\", \"error\": \"generation failed: \\(error.localizedDescription)\"]) }\n+            let ans = full.trimmingCharacters(in: .whitespacesAndNewlines)\n+            history.append((t, ans)); if history.count \u003e 4 { history.removeFirst() }\n+            dlog(\"STATS: \\(engine.lastStats)\\nA: \\(ans)\\nSOURCES: \\(srcs.joined(separator: \", \"))\")\n+            fin([\"ok\": true, \"via\": \"offline \u00b7 \\(modelLabel) \u00b7 \\(srcs.joined(separator: \", \"))\", \"reply\": ans, \"source\": srcs])\n+        }\n+    }\n+\n+    private func buildPrompt(_ q: String, hits: [(Chunk, Double)]) -\u003e String {\n+        var ctxText = \"\"\n+        for (c, _) in hits { ctxText += \"[\\(c.file) \u00b7 \\(c.head)]\\n\\(c.text)\\n\\n\" }\n+        var p = \"\u003c|im_start|\u003esystem\\n\\(persona)\\n\\nCONTEXT:\\n\\(ctxText)\u003c|im_end|\u003e\\n\"\n+        for (u, a) in history.suffix(2) where u.count + a.count \u003c 700 { p += \"\u003c|im_start|\u003euser\\n\\(u)\u003c|im_end|\u003e\\n\u003c|im_start|\u003eassistant\\n\\(a)\u003c|im_end|\u003e\\n\" }\n+        p += \"\u003c|im_start|\u003euser\\n\\(q)\u003c|im_end|\u003e\\n\u003c|im_start|\u003eassistant\\n\u003cthink\u003e\\n\\n\u003c/think\u003e\\n\\n\"\n+        return p\n+    }\n+}\n+\n+// self-test log: only when launched with --ask. A sandboxed app is re-launched by launchd (stdout/stderr are not inherited), so the log goes to the app container:\n+// ~/Library/Containers/info.rizal.rthundr/Data/Library/Caches/rthundr-selftest.log\n+let bootUptime = ProcessInfo.processInfo.systemUptime\n+func dlog(_ raw: String) {\n+    guard CommandLine.arguments.contains(\"--ask\") else { return }\n+    let s = String(format: \"[%6.1fs] \", ProcessInfo.processInfo.systemUptime - bootUptime) + raw\n+    let f = URL(fileURLWithPath: NSHomeDirectory() + \"/Library/Caches/rthundr-selftest.log\")\n+    try? FileManager.default.createDirectory(at: f.deletingLastPathComponent(), withIntermediateDirectories: true)\n+    if let h = try? FileHandle(forWritingTo: f) { h.seekToEndOfFile(); h.write((s + \"\\n\").data(using: .utf8)!); try? h.close() } else { try? (s + \"\\n\").write(to: f, atomically: true, encoding: .utf8) }\n+}\n"}, "00422a3743b7d8ba43e2c38c865391c65d56daf1": {"summary": "Add RFORGE offline Git snapshot browser and verified bundle exporter", "diff": "commit 00422a3743b7d8ba43e2c38c865391c65d56daf1\nAdd RFORGE offline Git snapshot browser and verified bundle exporter\n\ndiff --git a/.gitignore b/.gitignore\nnew file mode 100644\nindex 0000000..7a60b85\n--- /dev/null\n+++ b/.gitignore\n@@ -0,0 +1,2 @@\n+__pycache__/\n+*.pyc\ndiff --git a/hub/export.py b/hub/export.py\nnew file mode 100644\nindex 0000000..3256def\n--- /dev/null\n+++ b/hub/export.py\n@@ -0,0 +1,39 @@\n+#!/usr/bin/env python3\n+\"\"\"Export a verified bundle as a self-contained read-only RthundRhub snapshot.\"\"\"\n+import argparse,base64,datetime,hashlib,json,pathlib,subprocess,tempfile\n+\n+def git(repo,*args):\n+ return subprocess.check_output(['git','--git-dir='+str(repo),*args])\n+def build(bundle):\n+ bundle=pathlib.Path(bundle).resolve()\n+ if not bundle.is_file():raise ValueError('bundle missing')\n+ with tempfile.TemporaryDirectory() as tmp:\n+  repo=pathlib.Path(tmp)/'repo.git'\n+  subprocess.run(['git','init','--bare',str(repo)],check=True,stdout=subprocess.DEVNULL)\n+  subprocess.run(['git','--git-dir='+str(repo),'bundle','verify',str(bundle)],check=True,capture_output=True)\n+  heads=subprocess.check_output(['git','bundle','list-heads',str(bundle)]).decode().splitlines()\n+  refs={line.split()[1]:line.split()[0] for line in heads}\n+  if not refs:raise ValueError('empty bundle')\n+  for ref in refs:subprocess.run(['git','--git-dir='+str(repo),'fetch',str(bundle),ref+':'+ref],check=True,capture_output=True)\n+  data={'refs':refs,'branches':{},'commits':{},'blobs':{},'created':datetime.datetime.now(datetime.timezone.utc).isoformat(),'bundle_sha256':hashlib.sha256(bundle.read_bytes()).hexdigest()}\n+  for ref,sha in refs.items():\n+   entries=[]\n+   for row in git(repo,'ls-t <script>
'use strict';
const data=JSON.parse(document.getElementById('snapshot').textContent), $=id=>document.getElementById(id);
$('identity').textContent='Export: '+data.created+'\nBundle SHA-256: '+data.bundle_sha256+'\n'+Object.entries(data.refs).map(([r,s])=>r+' '+s).join('\n');
function button(parent,label,click){const b=document.createElement('button');b.textContent=label;b.onclick=click;parent.appendChild(b);}
function choose(){const branch=data.branches[$('branch').value];$('files').replaceChildren();$('history').replaceChildren();$('title').textContent='Choose a file or commit';$('content').textContent='';
 for(const f of branch.files)button($('files'),f.path,()=>{$('title').textContent=f.path+' · '+f.oid;if(f.kind!=='blob'){$('content').textContent='Git submodule/object '+f.oid;return;}const bytes=Uint8Array.from(atob(data.blobs[f.oid]),c=>c.charCodeAt(0));$('content').textContent=bytes.includes(0)?'Binary file; '+bytes.length+' exact bytes retained in snapshot (base64).':Array.from(new TextDecoder().decode(bytes).split('\n'),(line,i)=>String(i+1).padStart(4)+'  '+line).join('\n');});
 for(const sha of branch.history)button($('history'),sha.slice(0,12)+' '+data.commits[sha].summary,()=>{$('title').textContent=sha;$('content').textContent=data.commits[sha].diff;});}
for(const ref of Object.keys(data.refs)){const option=document.createElement('option');option.value=ref;option.textContent=ref;$('branch').appendChild(option);}
$('branch').onchange=choose;$('tree').onclick=()=>{$('files').hidden=false;$('history').hidden=true;};$('log').onclick=()=>{$('files').hidden=true;$('history').hidden=false;};choose();
</script></html>
