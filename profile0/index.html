<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self'">
<title>RKEY profile 0</title>
<style>
body{font-family:system-ui,sans-serif;background:#0b0b0f;color:#e8e8ee;display:flex;justify-content:center;padding:2rem}
.card{max-width:34rem;border:1px solid #333;border-radius:12px;padding:1.5rem;background:#14141b}
button{margin:.25rem .25rem 0 0;padding:.5rem 1rem;border-radius:8px;border:1px solid #555;background:#222;color:#fff;cursor:pointer}
pre{white-space:pre-wrap;word-break:break-all;background:#000;padding:.75rem;border-radius:8px;font-size:.8rem}
</style>
</head>
<body>
<div class="card">
<h1 id="pname">RKEY profile 0</h1>
<p id="pstatus"></p>
<p id="plinks"></p>
<p><small>Last updated: <span id="pupdated">loading…</span></small></p>
<hr>
<h2>RKEY profile 0 passkey</h2>
<p>Public profile. This page creates or checks a passkey on this device (rpId rizal.pw) and hands the public credential to the RKRYPT back end. No private key ever leaves the device; all verification happens on the back end.</p>
<button id="create">Create passkey</button>
<button id="get">Check passkey</button>
<button id="export" disabled>Copy public credential</button>
<pre id="out">Ready.</pre>
</div>
<script>
(function(){
  var out=document.getElementById('out'), pub=null;
  function b64u(buf){var s='',b=new Uint8Array(buf);for(var i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
  function rnd(n){var a=new Uint8Array(n);crypto.getRandomValues(a);return a;}
  function show(o){out.textContent=typeof o==='string'?o:JSON.stringify(o,null,2);}
  document.getElementById('create').onclick=async function(){
    try{
      var c=await navigator.credentials.create({publicKey:{
        rp:{id:'rizal.pw',name:'RKEY profile 0'},
        user:{id:rnd(16),name:'profile0',displayName:'RKEY profile 0'},
        challenge:rnd(32),
        pubKeyCredParams:[{type:'public-key',alg:-7}],
        authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'preferred'},
        attestation:'none'}});
      var pk=c.response.getPublicKey?c.response.getPublicKey():null;
      pub={profile:'RKEY profile 0',rpId:'rizal.pw',alg:'ES256',id:c.id,publicKeySpki:pk?b64u(pk):null};
      document.getElementById('export').disabled=false; show(pub);
    }catch(e){show('Create failed: '+e.message);}
  };
  document.getElementById('get').onclick=async function(){
    try{
      var a=await navigator.credentials.get({publicKey:{rpId:'rizal.pw',challenge:rnd(32),userVerification:'required'}});
      show({rpId:'rizal.pw',id:a.id,note:'Assertion made locally. Verification is done by the RKRYPT back end.'});
    }catch(e){show('Check failed: '+e.message);}
  };
  document.getElementById('export').onclick=async function(){
    if(!pub)return; var j=JSON.stringify(pub);
    try{await navigator.clipboard.writeText(j);show('Public credential copied. Hand it to the RKRYPT back end.\n\n'+j);}catch(e){show(j);}
  };
})();
(function(){
  function el(id){return document.getElementById(id);}
  async function load(){
    try{
      var r=await fetch('profile.json?t='+Date.now(),{cache:'no-store'});
      if(!r.ok)throw new Error(r.status);
      var p=await r.json();
      el('pname').textContent=p.displayName||'RKEY profile 0';
      el('pstatus').textContent=p.status||'';
      var L=el('plinks');L.textContent='';
      (p.links||[]).forEach(function(l){if(!/^https:\/\/(www\.)?rizal\.(pw|info)(\/|$)/.test(l.url))return;var a=document.createElement('a');a.href=l.url;a.textContent=l.label||l.url;a.rel='noopener';L.appendChild(a);L.appendChild(document.createTextNode(' '));});
      el('pupdated').textContent=p.updated?new Date(p.updated).toLocaleString():'unknown';
    }catch(e){el('pupdated').textContent='unavailable ('+e.message+')';}
  }
  load();setInterval(load,60000);
})();
</script>
</body>
</html>
