<!doctype html><html><head><meta charset="utf-8"><title>ThundR moods test</title><script src="../thundr-live.js"></script></head>
<body style="background:#151022;color:#fff;font:14px system-ui"><div id="thundr-pin" style="position:fixed;left:40px;top:60px"><thundr-live state="idle" size="48" base="../atlas/"></thundr-live><div class="lbl">ThundR · idle</div></div>
<pre id="out" style="margin-top:160px"></pre><div id="grid" style="display:flex;flex-wrap:wrap;gap:6px"></div>
<script src="../thundr-moods.js"></script><script>
const o=document.getElementById('out'),R=[];const T=THUNDR_MOODS;
R.push('api '+!!(window.THUNDR&&THUNDR.mood&&THUNDR.move)+' moods='+T.moods().length+' base='+T.base());
T.moods().forEach(m=>{const i=new Image();i.width=60;i.title=m;i.src=T.base()+m+'.png';i.onload=()=>R.push('img ok '+m);i.onerror=()=>R.push('IMG FAIL '+m);grid.append(i)});
R.push('mood smug '+THUNDR.mood('smug')+' unknown '+THUNDR.mood('nope')+' alias angry '+THUNDR.mood('angry'));
R.push('move wave '+THUNDR.move('wave')+' fly '+THUNDR.move('fly'));
document.querySelector('thundr-live').setAttribute('state','error');
setTimeout(()=>{R.push('cmd '+T.command('mood grimace')+' cur='+T.current());o.textContent=R.join('\n');document.title='DONE '+R.filter(x=>/FAIL|false/.test(x)).length+' issues'},1500);
</script></body></html>
