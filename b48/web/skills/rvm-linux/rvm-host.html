<script>
(function(){

  function say(t){ st.textContent = 'ЯVM · ' + t; }
  window.addEventListener('message', function(e){
    if (e.source !== vm.contentWindow || !e.data) return;
    var d = e.data;
    if (d.t === 'rvm.linux.ready') say('booting · offline · DRAGONGATE');

    if (!window.DG || typeof fetch !== 'function') { say('blocked (no gate) ' + url); return; }

      .catch(function(err){ say('DRAGONGATE blocked ' + url + ' · ' + (err && err.message || err)); });
  });
})();
