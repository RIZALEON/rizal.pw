<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ЯLOGIN · log in</title>
<style>
:root{--g:#39ff14;--p:#b388ff;--pp:#8a2be2}
*{box-sizing:border-box}body{margin:0;background:#000;color:var(--g);font:14px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
main{max-width:560px;margin:0 auto;padding:18px}h1{font-size:18px;margin:0 0 4px}h1 b{color:var(--p)}.dim{opacity:.65;font-size:12px}
.box{border:1px solid var(--g);border-radius:6px;padding:12px;margin:12px 0}.box h2{font-size:14px;margin:0 0 8px;color:var(--p)}
.pill{display:inline-block;background:var(--pp);color:#fff;border:1px solid var(--p);border-radius:999px;padding:6px 14px;margin:4px 6px 4px 0;cursor:pointer;font:inherit}
.pill:disabled{opacity:.4;cursor:not-allowed}.pill.sec{background:transparent;color:var(--p)}
.tabs .pill{background:transparent;color:var(--p)}.tabs .pill.on{background:var(--pp);color:#fff}
input,textarea{width:100%;background:#000;color:var(--g);border:1px solid #1f8a0c;border-radius:4px;padding:8px;font:inherit;margin:4px 0}
label{display:block;margin-top:6px}.n{color:var(--p);font-weight:bold;margin-right:6px}
#code{font-size:26px;letter-spacing:3px;color:var(--p)}#qr svg{background:#fff;padding:6px;margin-top:6px;max-width:200px}
#s-meter{height:6px;background:#111;border-radius:3px;overflow:hidden}#s-meter i{display:block;height:100%;width:0;background:var(--g);transition:width .2s}
#msg{min-height:20px;margin:10px 0;color:var(--p)}#msg.err{color:#ff5370}.kv b{color:var(--p);font-weight:normal}
[hidden]{display:none!important}a{color:var(--p)}
</style></head><body><main>
<h1><b>Я</b>LOGIN · CryptoSocial</h1>
<div class="box">
 <label>username<input id="l-user" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="username"></label>
 <label>password<input id="l-pass" type="password" autocomplete="current-password"></label>
 <button class="pill" id="b-login">Log in</button>
</div>
<div id="msg" role="status"></div><div id="who" class="dim"></div>
<div><a class="pill sec" href="/login/options/?tab=signup" id="a-create" style="text-decoration:none">Create account</a></div>
<div style="margin-top:8px"><a href="/login/options/" id="a-options">Other options</a> <span class="dim">(restore from file, auto-login, approve from another device, RGEN verify, login self-check)</span></div>
<div class="dim" style="margin-top:14px"><a href="/">← CryptoSocial</a></div>
</main>
<script src="/rdragon-cryptosocial/rdragon-config.js?v=17"></script><script src="/rdragon-cryptosocial/rkrypt.rzl.js?v=15"></script><script src="/rdragon-cryptosocial/rsync-core.js?v=16"></script><script src="/rdragon-cryptosocial/rsync-qr.js?v=15"></script><script src="/rdragon-cryptosocial/rfounder.js?v=1"></script><script src="/rdragon-cryptosocial/rlogin-page.js?v=20"></script>
</body></html>
