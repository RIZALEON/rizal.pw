<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rizal.pw Transponder</title><style>body{font:16px system-ui;max-width:700px;margin:8vh auto;padding:20px;background:#101827;color:#eef}input,button{display:block;width:100%;padding:12px;margin:10px 0;box-sizing:border-box}section{background:#1b2940;padding:20px;border-radius:14px;margin:16px 0}a{color:#8cf}</style><h1>Rizal.pw File Portal</h1><section><label>iPhone server URL<input id="url" placeholder="http://192.168.1.20:8787"></label><label>Access token<input id="token" type="password"></label><button onclick="connect()">Connect</button><p id="status">Not connected</p></section><section><h2>RKLOWD files</h2><button onclick="listFiles()">Refresh</button><div id="files"></div><h3>Upload</h3><input id="upload" type="file" multiple><button onclick="uploadFiles()">Upload selected</button></section><script>const $=x=>document.getElementById(x);function base(){return $('url').value.replace(/\/$/,'')}function headers(){return {Authorization:'Bearer '+$('token').value}}async function connect(){try{let r=await fetch(base()+'/api/health',{headers:headers()});if(!r.ok)throw Error('HTTP '+r.status);$('status').textContent='Connected';listFiles()}catch(e){$('status').textContent='Connection failed: '+e.message}}async function listFiles(){try{let r=await fetch(base()+'/api/files',{headers:headers()});if(!r.ok)throw Error('HTTP '+r.status);let d=await r.json();$('files').replaceChildren();d.files.forEach(f=>{let a=document.createElement('a');a.href='#';a.textContent=f.name+' ('+f.size+' bytes)';a.onclick=async e=>{e.preventDefault();let x=await fetch(base()+'/api/download/'+encodeURIComponent(f.name),{headers:headers()});if(!x.ok)return alert('Download failed');let u=URL.createObjectURL(await x.blob()),n=document.createElement('a');n.href=u;n.download=f.name;n.click();URL.revokeObjectURL(u)};$('files').append(a,document.createElement('br'))})}catch(e){$('files').textContent=e.message}}async function uploadFiles(){for(const f of $('upload').files){let fd=new FormData();fd.append('file',f,f.name);let r=await fetch(base()+'/api/upload',{method:'POST',headers:headers(),body:fd});if(!r.ok){$('status').textContent='Upload failed: '+f.name+' HTTP '+r.status;return}}$('status').textContent='Upload complete';listFiles()}</script></html>
